name: CI & Deploy

on:
  push:
    branches: [master]
  # PR にもチェックを出す (master に入る前に落とすため)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # master のデプロイは直列化し、PR は新しい push で古い実行を打ち切る
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR でも master でも走る検証。ここが赤ければ deploy に進まない
  test:
    runs-on: ubuntu-latest
    # master への push のときだけ Pages 用の成果物を残す
    env:
      IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # sim/ のゲームルールテスト (ブラウザ不要)
      - run: node sim/engine.test.js
      # React 側のテスト (jsdom)
      - run: npm test -- --watchAll=false
        env:
          CI: true
      # 型チェックはここで落ちる (jest は babel 経由なので .tsx の型エラーを拾えない)
      - run: npm run build
        env:
          # CRA は CI=true だと警告もエラー扱いにするため無効化
          CI: false
      - uses: actions/configure-pages@v5
        if: env.IS_RELEASE == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: env.IS_RELEASE == 'true'
        with:
          path: build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
